    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Your Name",
        "jobTitle": "Freelance AI Engineer & Full-Stack Developer",
        "description": "Freelance AI engineer and full-stack developer for hire: RAG pipelines, AI agents, web apps, FastAPI APIs, and automation.",
        "email": "mailto:you@example.com",
        "url": "https://github.com/your-username",
        "image": "/images/placeholder.webp",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Your City",
          "addressCountry": "Country"
        },
        "sameAs": [
          "https://github.com/your-username",
          "https://www.linkedin.com/in/your-username/"
        ],
        "knowsAbout": [
          "RAG",
          "AI Agents",
          "LangChain",
          "OpenRouter",
          "Hugging Face",
          "Prompt Engineering",
          "React",
          "TypeScript",
          "FastAPI",
          "PostgreSQL",
          "Docker",
          "CI/CD",
          "Automation"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "AI & LLM Features",
              "description": "RAG pipelines, agent architecture, context engineering, and quality gates wired into your product."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Web Apps & Dashboards",
              "description": "React and TypeScript applications, dashboards, and internal tools."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "APIs & Data Backends",
              "description": "FastAPI services and PostgreSQL data layers, documented and tested."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Automation & Ops",
              "description": "Workflow automation, ETL pipelines, and CI/CD developer tooling."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Service",
              "name": "Data Engineering & Data Modeling",
              "description": "ETL pipelines, PostgreSQL data modeling, executive dashboards, and database vectorization for AI."
            }
          }
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do we start?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A 30-minute scope call, then a fixed-scope proposal with milestones, deliverables, and price on one page. Kickoff usually happens within a week."
            }
          },
          {
            "@type": "Question",
            "name": "How much does a project cost?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "It depends on scope. You get a fixed price per milestone after the call — no hourly surprises and no hidden fees."
            }
          },
          {
            "@type": "Question",
            "name": "Do you work with existing teams?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes — async-first across timezones (UTC−3), weekly demos, and clean handoff: repo, docs, and tests so your team owns everything."
            }
          },
          {
            "@type": "Question",
            "name": "Do you take retainers?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Beyond fixed-scope projects, I take monthly retainers for ongoing AI and product engineering work."
            }
          }
        ]
      }
    </script>
